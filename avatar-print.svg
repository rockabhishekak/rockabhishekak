<svg width="220" height="220" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="avatarRound">
      <rect x="0" y="0" width="220" height="220" rx="24" ry="24" />
    </clipPath>
    <clipPath id="printReveal">
      <rect x="0" y="0" width="220" height="0">
        <animate
          attributeName="height"
          values="0;220;220;0;0"
          keyTimes="0;0.45;0.75;0.78;1"
          dur="4s"
          repeatCount="indefinite" />
      </rect>
    </clipPath>
  </defs>

  <!-- rounded frame background -->
  <rect x="0" y="0" width="220" height="220" rx="24" ry="24" fill="#0d1117" />

  <!-- avatar, revealed top-to-bottom like it's printing out -->
  <g clip-path="url(#avatarRound)">
    <g clip-path="url(#printReveal)">
      <image href="./avatar.png" x="0" y="0" width="220" height="220" preserveAspectRatio="xMidYMid slice" />
    </g>
  </g>

  <!-- glowing scan line that travels with the reveal -->
  <rect x="0" width="220" height="4" fill="#58A6FF" opacity="0.9">
    <animate
      attributeName="y"
      values="0;216;216;0;0"
      keyTimes="0;0.45;0.75;0.78;1"
      dur="4s"
      repeatCount="indefinite" />
    <animate
      attributeName="opacity"
      values="0.9;0.9;0;0;0.9"
      keyTimes="0;0.45;0.5;0.78;1"
      dur="4s"
      repeatCount="indefinite" />
  </rect>

  <!-- rounded border on top -->
  <rect x="1.5" y="1.5" width="217" height="217" rx="22" ry="22" fill="none" stroke="#58A6FF" stroke-width="2" />
</svg>
